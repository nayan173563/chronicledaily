    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _curFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _curFetch; },
            set: function(fn) { _curFetch = fn; }
          });
        } catch (e) {}
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
